<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Resultados en el celular – Historial Mitre</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14284B}a:hover{color:#2D5BA3}
select{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Barlow, system-ui, sans-serif; color: #1A2233; background: #F2F4F8; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #14284B; color: #FFFFFF; padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 36px; height: 36px; border-radius: 50%; background: #FFFFFF; color: #14284B; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px">CDM</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px">RESULTADOS</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #C9D4E8; font-weight: 600">Año
        <select style="height: 44px; border-radius: 8px; border: 0; padding: 0 10px; font-size: 16px; color: #14284B; background: #FFFFFF"><option>2026</option><option>2025</option></select>
      </label>
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #C9D4E8; font-weight: 600">Torneo
        <select style="height: 44px; border-radius: 8px; border: 0; padding: 0 10px; font-size: 16px; color: #14284B; background: #FFFFFF"><option>Clausura</option><option>Apertura</option></select>
      </label>
    </div>
    <div role="group" aria-label="Categoría" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #22396A; border-radius: 10px; padding: 4px; gap: 4px">
      <button type="button" aria-pressed="true" style="height: 40px; border: 0; border-radius: 8px; background: #FFFFFF; color: #14284B; font-weight: 700; font-size: 15px; font-family: inherit">Primera</button>
      <button type="button" aria-pressed="false" style="height: 40px; border: 0; border-radius: 8px; background: transparent; color: #FFFFFF; font-weight: 600; font-size: 15px; font-family: inherit">Reserva</button>
    </div>
  </header>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 12px 16px 4px">
    <div style="background: #14284B; color: #FFFFFF; border-radius: 10px; padding: 8px; text-align: center"><div style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; line-height: 1">16</div><div style="font-size: 12px; color: #C9D4E8">Pts</div></div>
    <div style="background: #FFFFFF; border-radius: 10px; padding: 8px; text-align: center"><div style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; line-height: 1; color: #14284B">5-1-5</div><div style="font-size: 12px; color: #4A5468">G-E-P</div></div>
    <div style="background: #FFFFFF; border-radius: 10px; padding: 8px; text-align: center"><div style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; line-height: 1; color: #14284B">14</div><div style="font-size: 12px; color: #4A5468">GF</div></div>
    <div style="background: #FFFFFF; border-radius: 10px; padding: 8px; text-align: center"><div style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; line-height: 1; color: #14284B">16</div><div style="font-size: 12px; color: #4A5468">GC</div></div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 8px 16px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{ rows }}" as="m" hint-placeholder-count="6">
      <a href="Detalle.dc.html" style="text-decoration: none; color: #1A2233; background: #FFFFFF; border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 44px minmax(0, 1fr) 34px; gap: 10px; align-items: center">
        <div style="text-align: center"><div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; color: #14284B">F{{ m.f }}</div><div style="font-size: 12px; color: #4A5468">{{ m.d }}</div></div>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: {{ m.wl }}"><span>{{ m.l }}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700">{{ m.gl }}</span></div>
          <div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: {{ m.wv }}"><span>{{ m.v }}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700">{{ m.gv }}</span></div>
          <sc-if value="{{ m.hasG }}" hint-placeholder-val="{{ true }}"><div style="font-size: 12px; color: #4A5468; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ m.g }}</div></sc-if>
        </div>
        <span style="{{ m.chip }}">{{ m.r }}</span>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Secciones" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #DDE2EA">
    <a href="Main.dc.html" style="height: 60px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 700; font-size: 14px; color: #14284B; border-top: 3px solid #14284B">Resultados</a>
    <a href="Goleadores.dc.html" style="height: 60px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 14px; color: #4A5468">Goleadores</a>
    <a href="Historial.dc.html" style="height: 60px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 14px; color: #4A5468">Historial</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const base = 'display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;font-weight:700;font-size:14px;';
    const chip = { G: base + 'background:#14284B;color:#FFFFFF;', E: base + 'background:#E3E7EE;color:#2F3A4D;', P: base + 'background:#FCE3D2;color:#8A3B0F;' };
    const src = [
      [11,'16/10','Dep. Mitre','San Martín',0,1,'P','',1],
      [10,'12/10','Juv. Unida','Dep. Mitre',6,0,'P','',0],
      [9,'04/10','Dep. Mitre','Atl. Sastre',0,0,'E','',1],
      [8,'27/09','Piamonte','Dep. Mitre',0,1,'G','Villarruel D.',0],
      [7,'13/09','Dep. Mitre','Juv. Guadalupe',2,1,'G','Ruiz Díaz G. ×2',1],
      [6,'06/09','El Expreso','Dep. Mitre',2,0,'P','',0],
      [5,'30/08','Dep. Mitre','Americano',2,1,'G','Ruiz Díaz G., Fossarelli A.',1]
    ];
    return { rows: src.map(([f,d,l,v,gl,gv,r,g,h]) => ({ f, d, l, v, gl, gv, r, g, hasG: g !== '', chip: chip[r], wl: h ? 700 : 400, wv: h ? 400 : 700 })) };
  }
}
</script>
</body>
</html>
